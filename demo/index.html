<!DOCTYPE html>
<html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Adaptive Asset PoC</title>
<style>
:root{color-scheme:dark;font:15px system-ui,sans-serif;background:#101722;color:#e0e8f4}body{max-width:800px;margin:32px auto;padding:0 16px}h1{font-size:25px}h2{font-size:16px}p{color:#b9c9da;line-height:1.6}button,select{font:inherit;padding:10px 14px;border:1px solid #526782;border-radius:7px;background:#26374c;color:#fff;cursor:pointer}button:disabled{opacity:.4}button[aria-pressed=true]{border-color:#78dbcf;background:#1c514f}#scene{display:grid;place-items:center;height:310px;border:1px solid #526782;border-radius:12px;background:linear-gradient(135deg,#435e79,#192b44);position:relative;overflow:hidden}#scene canvas{width:270px;height:270px;image-rendering:auto;z-index:1}#scene small{position:absolute;bottom:12px;left:14px;color:white;background:#101722aa;padding:4px 8px;border-radius:4px}.controls{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.tracks{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px}article{border:1px solid #35465e;border-radius:8px;padding:12px}progress{width:100%;accent-color:#68d7c6}pre{font:12px ui-monospace,monospace;white-space:pre-wrap;max-height:230px;overflow:auto;background:#182332;padding:12px;border-radius:8px}label{display:flex;align-items:center;gap:8px}#error{color:#ffb1a5}
</style>
<main><h1>Adaptive Asset Runtime — PoC</h1><p>同じ意味的な要求から、表情と音響が独立した同期点で遷移する。音声は任意で有効化できる。</p>
<div id="scene"><canvas id="face" width="192" height="192" aria-label="透過キャラクター素材"></canvas><small>RGBA frame sequence / independent background</small></div>
<div class="controls"><button id="start" disabled>開始（音声あり）</button><button id="silent" disabled>開始（無音）</button><label>背景 <select id="bg"><option value="blue">青</option><option value="warm">暖色</option><option value="check">透過確認</option></select></label></div>
<div class="controls" id="presets"><button data-preset="neutral" disabled>平静</button><button data-preset="friendly" disabled>親しげ</button><button data-preset="tense" disabled>緊張</button></div>
<p id="clock">素材読込中…</p><p id="error" role="alert"></p><div class="tracks"><article><h2>表情 / Face</h2><div id="face-state"></div><progress id="face-progress" max="1" value="0"></progress></article><article><h2>音響 / Audio</h2><div id="audio-state"></div><progress id="audio-progress" max="1" value="0"></progress></article></div>
<h2>遷移イベント（論理時刻）</h2><pre id="log" aria-live="off"></pre><p>PNGアトラスを使ってフレームを決定論的に選択する。対応する透過WebMも assets/ に同梱。WebM再生、音声クロスフェードのサンプル精度、Godot統合は次の検証対象。</p></main>
<script type="module" src="./app.mjs"></script></html>
